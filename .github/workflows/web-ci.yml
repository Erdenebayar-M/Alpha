name: web-ci

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/ is not an npm workspace of the repo root (same convention as mobile/),
      # so it's installed standalone here, same as a local dev setup.
      - run: npm ci

      # `build` must run first: app/layout.tsx uses Next's typed-routes `LayoutProps`,
      # which only exists once `.next/types` has been generated by a build/dev run —
      # `tsc --noEmit` fails cold on a fresh checkout otherwise.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
